<svg xmlns="http://www.w3.org/2000/svg" width="960" height="190" viewBox="0 0 960 190" role="img" aria-label="Engineering Architecture Pipeline">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07101D"/>
      <stop offset="100%" stop-color="#0F1D32"/>
    </linearGradient>
  </defs>
  <style>
    .flow{stroke-dasharray:5 9;animation:flow 1.8s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-28}}
    @media(prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>
  <rect width="960" height="190" rx="16" fill="url(#archBg)" stroke="#263B54" stroke-width="1.5"/>
  <text x="28" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.2" fill="#839BB5">ENGINEERING ARCHITECTURE PIPELINE</text>
