<svg xmlns="http://www.w3.org/2000/svg" width="960" height="185" viewBox="0 0 960 185" role="img" aria-label="4-Stage Software and AI Engineering Lifecycle">
  <defs>
    <linearGradient id="lifeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>
  <style>
    .flow{stroke-dasharray:4 8;animation:flow 1.8s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-24}}
    .step{animation:pulse 4s ease-in-out infinite}
    .s2{animation-delay:1s}.s3{animation-delay:2s}.s4{animation-delay:3s}
    @keyframes pulse{0%,100%{opacity:0.35}50%{opacity:1}}
    .bar{transform-origin:left center;animation:grow 8s ease-in-out infinite}
    @keyframes grow{0%,100%{opacity:0.45}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.flow,.step,.bar{animation:none}}
  </style>
  <rect width="960" height="185" rx="16" fill="url(#lifeBg)" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="28" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.1" fill="#64748B">ENGINEERING WORKFLOW · FROM SPECIFICATION TO PRODUCTION</text>
  <path d="M 238 105 H 260 M 470 105 H 492 M 702 105 H 724" fill="none" stroke="#CBD5E1" stroke-width="1.5"/><path class="flow" d="M 238 105 H 260 M 470 105 H 492 M 702 105 H 724" fill="none" stroke="#0284C7" stroke-width="1.8"/>
  <rect x="28" y="52" width="210" height="106" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><rect x="28" y="52" width="210" height="3" rx="1.5" fill="#0284C7"/><circle cx="221" cy="70" r="3" fill="#0284C7" class="step s1"/><text x="43" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="0.6" fill="#0284C7">01 · ARCHITECT</text><text x="43" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">Domain &amp; API Design</text><text x="43" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748B">Contracts, schemas, RBAC</text><rect x="43" y="140" width="180" height="3" rx="1.5" fill="#E2E8F0"/><rect x="43" y="140" width="180" height="3" rx="1.5" fill="#0284C7" class="bar s1"/><rect x="260" y="52" width="210" height="106" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><rect x="260" y="52" width="210" height="3" rx="1.5" fill="#4F46E5"/><circle cx="453" cy="70" r="3" fill="#4F46E5" class="step s2"/><text x="275" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="0.6" fill="#4F46E5">02 · ENGINEER</text><text x="275" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">Web &amp; Backend Code</text><text x="275" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748B">Node.js ESM, PHP 8.3 MVC</text><rect x="275" y="140" width="180" height="3" rx="1.5" fill="#E2E8F0"/><rect x="275" y="140" width="180" height="3" rx="1.5" fill="#4F46E5" class="bar s2"/><rect x="492" y="52" width="210" height="106" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><rect x="492" y="52" width="210" height="3" rx="1.5" fill="#059669"/><circle cx="685" cy="70" r="3" fill="#059669" class="step s3"/><text x="507" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="0.6" fill="#059669">03 · INTEGRATE AI</text><text x="507" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">Search &amp; Automation</text><text x="507" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748B">FTS5, LLM APIs, contexts</text><rect x="507" y="140" width="180" height="3" rx="1.5" fill="#E2E8F0"/><rect x="507" y="140" width="180" height="3" rx="1.5" fill="#059669" class="bar s3"/><rect x="724" y="52" width="210" height="106" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><rect x="724" y="52" width="210" height="3" rx="1.5" fill="#D97706"/><circle cx="917" cy="70" r="3" fill="#D97706" class="step s4"/><text x="739" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="0.6" fill="#D97706">04 · VERIFY &amp; SHIP</text><text x="739" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">Resilience &amp; CI/CD</text><text x="739" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748B">Chaos tests, Merkle proofs</text><rect x="739" y="140" width="180" height="3" rx="1.5" fill="#E2E8F0"/><rect x="739" y="140" width="180" height="3" rx="1.5" fill="#D97706" class="bar s4"/>
</svg>
