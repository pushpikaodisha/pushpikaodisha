<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="Pushpika Odisha — Systems and Full-Stack Architect">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="55%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="constellationGlow">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="orthoGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#CBD5E1" stroke-width="0.6" stroke-opacity="0.45"/>
    </pattern>
  </defs>
  <style>
    .pkt{stroke-dasharray:6 18;animation:flow 2.8s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-48}}
    .orbit{transform-origin:745px 136px;animation:spin 32s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .pulse{animation:blink 3s ease-in-out infinite}
    @keyframes blink{50%{opacity:0.35}}
    @media(prefers-reduced-motion:reduce){.pkt,.orbit,.pulse{animation:none}}
  </style>

  <rect width="960" height="300" rx="16" fill="url(#heroBg)" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="1" y="1" width="958" height="298" rx="15" fill="url(#orthoGrid)"/>
  <circle cx="745" cy="136" r="190" fill="url(#constellationGlow)"/>

