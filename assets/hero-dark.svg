<svg xmlns="http://www.w3.org/2000/svg" width="960" height="265" viewBox="0 0 960 265" role="img" aria-label="Pushpika Odisha — Software, Web Applications and AI Systems Engineer">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <pattern id="subtleGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.45"/>
    </pattern>
  </defs>
  <style>
    .flow{stroke-dasharray:5 11;animation:flow 2.4s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-32}}
    .pulse{animation:blink 3s ease-in-out infinite}
    @keyframes blink{50%{opacity:0.4}}
    @media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
  </style>

  <rect width="960" height="265" rx="16" fill="url(#heroBg)" stroke="#1F2937" stroke-width="1.5"/>
  <rect x="1" y="1" width="958" height="263" rx="15" fill="url(#subtleGrid)"/>

  <!-- Left Identity Column -->
  <rect x="40" y="38" width="24" height="3.5" rx="1.75" fill="url(#brandGrad)"/>
  <text x="74" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#38BDF8">SOFTWARE · WEB APPS · AI SYSTEMS</text>

  <text x="40" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-1" fill="#F8FAFC">Pushpika <tspan fill="url(#brandGrad)">Odisha</tspan></text>
  <text x="40" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#CBD5E1">Building full-stack web applications, reliable backend</text>
  <text x="40" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#CBD5E1">software, and practical AI-integrated workflows.</text>

  <!-- Clean Capability Pill -->
  <rect x="40" y="176" width="326" height="26" rx="6" fill="#182235" stroke="#334155" stroke-width="1"/>
  <text x="54" y="193" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#CBD5E1">Node.js · PHP 8 · JavaScript · SQL · AI APIs</text>

  <!-- Bottom Status Strip -->
  <line x1="40" y1="222" x2="520" y2="222" stroke="#1F2937" stroke-width="1"/>
  <circle cx="46" cy="242" r="3.5" fill="#10B981" class="pulse"/>
  <text x="58" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#CBD5E1">Open to Software &amp; Web/AI Engineering Roles</text>
  <text x="520" y="246" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#94A3B8">Sri Lanka · @pushpikaodisha</text>

  <!-- Right System Architecture Bus & Nodes -->
  <path d="M 732 80 H 748 M 834 118 V 132 H 646 V 146 M 732 184 H 748" fill="none" stroke="#334155" stroke-width="1.5"/>
  <path class="flow" d="M 732 80 H 748 M 834 118 V 132 H 646 V 146 M 732 184 H 748" fill="none" stroke="#38BDF8" stroke-width="1.6"/>
  <rect x="560" y="42" width="172" height="76" rx="10" fill="#131B2B" stroke="#334155" stroke-width="1.2"/><rect x="560" y="42" width="172" height="2.5" rx="1.2" fill="#38BDF8"/><text x="573" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="600" letter-spacing="0.6" fill="#38BDF8">01 · WEB CLIENT</text><text x="573" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">Responsive UI &amp; Apps</text><text x="573" y="103" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#94A3B8">HTML5 · JS · SSE Streams</text><rect x="748" y="42" width="172" height="76" rx="10" fill="#131B2B" stroke="#334155" stroke-width="1.2"/><rect x="748" y="42" width="172" height="2.5" rx="1.2" fill="#6366F1"/><text x="761" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="600" letter-spacing="0.6" fill="#6366F1">02 · API &amp; CORE</text><text x="761" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">Backend Services</text><text x="761" y="103" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#94A3B8">Node.js · PHP 8 · RBAC</text><rect x="560" y="146" width="172" height="76" rx="10" fill="#131B2B" stroke="#334155" stroke-width="1.2"/><rect x="560" y="146" width="172" height="2.5" rx="1.2" fill="#10B981"/><text x="573" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="600" letter-spacing="0.6" fill="#10B981">03 · AI &amp; SEARCH</text><text x="573" y="189" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">Intelligent Workflows</text><text x="573" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#94A3B8">LLM APIs · FTS5 · Graphs</text><rect x="748" y="146" width="172" height="76" rx="10" fill="#131B2B" stroke="#334155" stroke-width="1.2"/><rect x="748" y="146" width="172" height="2.5" rx="1.2" fill="#38BDF8"/><text x="761" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="600" letter-spacing="0.6" fill="#38BDF8">04 · DATA LAYER</text><text x="761" y="189" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">Storage &amp; Proofs</text><text x="761" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#94A3B8">SQLite PDO · Merkle Audit</text>
  <text x="740" y="246" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1" fill="#94A3B8">PRODUCTION WEB &amp; AI ARCHITECTURE</text>
