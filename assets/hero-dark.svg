<svg xmlns="http://www.w3.org/2000/svg" width="960" height="285" viewBox="0 0 960 285" role="img" aria-label="Pushpika Odisha — Software, Web Applications and AI Systems Engineer">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <pattern id="subtleGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.45"/>
    </pattern>
  </defs>
  <style>
    .flow{stroke-dasharray:5 11;animation:flow 2.2s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-32}}
    .pulse{animation:blink 3s ease-in-out infinite}
    .p2{animation-delay:0.6s}.p3{animation-delay:1.2s}.p4{animation-delay:1.8s}
    @keyframes blink{50%{opacity:0.3}}
    .wave{stroke-dasharray:120;animation:wave 4s ease-in-out infinite}
    @keyframes wave{0%{stroke-dashoffset:120}50%,100%{stroke-dashoffset:0}}
    @media(prefers-reduced-motion:reduce){.flow,.pulse,.wave{animation:none}}
  </style>

  <rect width="960" height="285" rx="16" fill="url(#heroBg)" stroke="#1F2937" stroke-width="1.5"/>
  <rect x="1" y="1" width="958" height="283" rx="15" fill="url(#subtleGrid)"/>

  <rect x="40" y="38" width="24" height="3.5" rx="1.75" fill="url(#brandGrad)"/>
  <text x="74" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#38BDF8">SOFTWARE · WEB APPS · AI SYSTEMS</text>

  <text x="40" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="41" font-weight="800" letter-spacing="-1" fill="#F8FAFC">Pushpika <tspan fill="url(#brandGrad)">Odisha</tspan></text>
  <text x="40" y="131" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#CBD5E1">Building full-stack web applications, reliable backend</text>
  <text x="40" y="153" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#CBD5E1">software, and practical AI-integrated workflows.</text>

  <rect x="40" y="180" width="332" height="27" rx="6" fill="#182235" stroke="#334155" stroke-width="1"/>
  <text x="54" y="197" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#CBD5E1">Node.js · PHP 8 · JavaScript · SQL · AI APIs</text>

  <line x1="40" y1="234" x2="520" y2="234" stroke="#1F2937" stroke-width="1"/>
  <circle cx="46" cy="256" r="3.5" fill="#10B981" class="pulse"/>
  <text x="58" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#CBD5E1">Open to Software, Web &amp; AI Engineering Roles</text>
  <text x="520" y="260" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#94A3B8">Sri Lanka · @pushpikaodisha</text>

  <text x="552" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1" fill="#94A3B8">REQUEST PIPELINE</text>
  <path d="M 800 36 L 814 31 L 828 38 L 842 28 L 856 35 L 870 25 L 884 32 L 898 26 L 914 30" fill="none" stroke="#10B981" stroke-width="1.6" class="wave"/>

  <path d="M 726 92 H 742 M 829 130 V 141 H 639 V 152 M 726 190 H 742" fill="none" stroke="#334155" stroke-width="1.5"/>
  <path class="flow" d="M 726 92 H 742 M 829 130 V 141 H 639 V 152 M 726 190 H 742" fill="none" stroke="#38BDF8" stroke-width="1.7"/>
