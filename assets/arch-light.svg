<svg xmlns="http://www.w3.org/2000/svg" width="960" height="190" viewBox="0 0 960 190" role="img" aria-label="Engineering Architecture Pipeline">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
  </defs>
  <style>
    .flow{stroke-dasharray:5 9;animation:flow 1.8s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-28}}
    @media(prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>
  <rect width="960" height="190" rx="16" fill="url(#archBg)" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="28" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.2" fill="#64748B">ENGINEERING ARCHITECTURE PIPELINE</text>
  <path d="M 304 101 H 342" stroke="#94A3B8" stroke-width="2"/><path class="flow" d="M 304 101 H 342" stroke="#0284C7" stroke-width="2"/><path d="M 618 101 H 656" stroke="#94A3B8" stroke-width="2"/><path class="flow" d="M 618 101 H 656" stroke="#4F46E5" stroke-width="2"/>
  <rect x="28" y="44" width="276" height="114" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><rect x="28" y="44" width="276" height="3" rx="1.5" fill="#059669"/><text x="46" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.7" fill="#059669">01 · INTERFACE &amp; SIMULATION</text><text x="46" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Canvas 2D/3D · Web Audio</text><text x="46" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#64748B">Real-time physics, 4D projections, UI</text><rect x="342" y="44" width="276" height="114" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><rect x="342" y="44" width="276" height="3" rx="1.5" fill="#0284C7"/><text x="360" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.7" fill="#0284C7">02 · ENGINES &amp; APIs</text><text x="360" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Node.js ESM · PHP 8.3 MVC</text><text x="360" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#64748B">Chaos testing, SSE telemetry, RBAC</text><rect x="656" y="44" width="276" height="114" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><rect x="656" y="44" width="276" height="3" rx="1.5" fill="#4F46E5"/><text x="674" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.7" fill="#4F46E5">03 · DATA &amp; INTEGRITY</text><text x="674" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A">SQLite FTS5/PDO · Merkle</text><text x="674" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#64748B">Full-text indexing &amp; RFC 6962 proofs</text>
