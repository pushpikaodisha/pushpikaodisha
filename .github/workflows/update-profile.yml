name: Update Profile Assets

on:
  schedule:
    - cron: "*/30 * * * *"
  repository_dispatch:
    types: [new-project]
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_profile_assets.py"
      - "skills.json"

permissions:
  contents: write

jobs:
  update-svgs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate dynamic profile SVGs and sync projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_GH_TOKEN: ${{ secrets.PROFILE_GH_TOKEN }}
        run: python scripts/generate_profile_assets.py

      - name: Commit updated assets and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg README.md
          git diff --cached --quiet || git commit -m "chore: sync dynamic projects and telemetry SVGs"
          git push
